name: covclaim multi-arch image

# Builds ghcr.io/<owner>/fulmine:covclaim for linux/amd64 + linux/arm64 on
# GitHub runners (amd64 native, arm64 via QEMU) and pushes a multi-arch
# manifest. Lets Dokploy / amd64 CI pull the covclaim fork by tag.

on:
  push:
    branches: [feat/nic]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/fulmine:covclaim
          build-args: |
            VERSION=covclaim
            COMMIT=${{ github.sha }}
