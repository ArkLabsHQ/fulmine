name: ci_integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version: ">=1.26.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: go get -v -t -d ./...

      - name: Build Fulmine image (under test)
        run: docker build -t fulmine:e2e .

      - name: Start regtest infrastructure
        run: node regtest/regtest.mjs start --profile boltz,delegate

      - name: Run integration tests
        run: make integrationtest

      - name: Stack logs
        if: failure()
        continue-on-error: true
        run: |
          docker ps -a
          for c in boltz boltz-fulmine boltz-lnd fulmine-delegator arkd arkd-wallet lnd bitcoin; do
            echo "::group::docker logs $c"
            docker logs "$c" 2>&1 | tail -n 600 || echo "(no container $c)"
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: node regtest/regtest.mjs clean || true
