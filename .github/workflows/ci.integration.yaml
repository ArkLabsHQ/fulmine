name: ci_integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v6
        with:
          go-version: ">=1.26.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: go get -v -t -d ./...

      # Authenticate to Docker Hub so the many image pulls (arkd, boltz, lnd,
      # mempool, fulcrum, nbxplorer, golang/alpine, ...) aren't subject to the
      # anonymous rate limit that intermittently fails the run on shared runners.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Fulmine image (under test)
        run: docker build -t fulmine:e2e .

      - name: Start regtest infrastructure
        run: |
          for attempt in 1 2 3; do
            if node regtest/regtest.mjs start --profile boltz,delegate; then
              exit 0
            fi
            echo "::warning::regtest stack start attempt $attempt failed (often a transient Docker Hub image pull); cleaning up and retrying..."
            node regtest/regtest.mjs clean || true
            sleep 15
          done
          echo "::error::regtest stack failed to start after 3 attempts"
          exit 1

      - name: Start user Fulmine
        run: make regtest-user-up

      - name: Run integration tests
        run: make integrationtest

      - name: Stack logs
        if: failure()
        continue-on-error: true
        run: |
          docker ps -a
          for c in fulmine-user boltz boltz-fulmine boltz-lnd fulmine-delegator arkd arkd-wallet lnd bitcoin; do
            echo "::group::docker logs $c"
            docker logs "$c" 2>&1 | tail -n 600 || echo "(no container $c)"
            echo "::endgroup::"
          done

      - name: Tear down
        if: always()
        run: |
          docker rm -f fulmine-user || true
          node regtest/regtest.mjs clean || true
