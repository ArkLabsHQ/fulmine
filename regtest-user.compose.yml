# Dedicated "user" Fulmine for the e2e suite.
#
# arkade-regtest's boltz-fulmine is Boltz's OWN Ark wallet (Boltz's config has
# `[ark] host = "boltz-fulmine"`), so it can't double as the swap counterparty's
# user wallet — when the test client and Boltz share one instance, Boltz locks
# the swap's Ark VHTLC but the "user" never claims it and the swap sits in
# "pending". The pre-arkade-regtest stack had a separate `fulmine` user service;
# this overlay restores that as another instance of THIS repo's image
# (fulmine:e2e), attached to the running arkade-regtest network.
#
# Brought up by `make regtest-up` / the integration CI after the stack starts,
# and torn down by `make regtest-down`.
services:
  fulmine-user:
    image: fulmine:e2e
    container_name: fulmine-user
    restart: unless-stopped
    environment:
      - FULMINE_ARK_SERVER=http://arkd:7070
      - FULMINE_ESPLORA_URL=http://mempool_web/api
      - FULMINE_BOLTZ_URL=http://boltz:9001
      - FULMINE_BOLTZ_WS_URL=ws://boltz:9004
      - FULMINE_NO_MACAROONS=true
      - FULMINE_DISABLE_TELEMETRY=true
      - FULMINE_SWAP_TIMEOUT=120
      - FULMINE_SCHEDULER_POLL_INTERVAL=10
      - FULMINE_UNLOCKER_TYPE=env
      - FULMINE_UNLOCKER_PASSWORD=password
      - FULMINE_DELEGATE_ENABLED=true
      # Compressed pubkey of EMULATOR_SECRET_KEY (regtest/.env.defaults) — the
      # non-interactive claim tapscript key. covclaimd/emulator claim with it.
      - FULMINE_EMULATOR_PUBKEY=02999413c46fa10ada5cbc4bcc79a1d09160c2ba3cfc812705d7a13e5e545fb2a9
    ports:
      # Bind to loopback only: with FULMINE_NO_MACAROONS the endpoints are
      # unauthenticated, and the e2e suite reaches them via localhost anyway.
      - "127.0.0.1:7020:7000" # gRPC  (clientFulmineURL)
      - "127.0.0.1:7021:7001" # REST/admin
    networks:
      - default

  covclaimd:
    image: ghcr.io/arkade-os/covclaimd:v0.0.1-rc.2
    container_name: covclaimd
    restart: unless-stopped
    environment:
      - COVCLAIMD_ARK_URL=arkd:7070
      - COVCLAIMD_EMULATOR_URL=emulator:7073
      - COVCLAIMD_SECRET_KEY=c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d5
      - COVCLAIMD_ENCRYPTED_ENABLED=true
      - COVCLAIMD_REVEAL_ENABLED=true
      - COVCLAIMD_LOG_LEVEL=4
    ports:
      - "127.0.0.1:7270:7070"
      - "127.0.0.1:7271:7071"
    networks:
      - default

  # Second user Fulmine running a SINGLE-KEY (legacy, pre-HD) identity, so the
  # e2e suite covers the legacy identity paths that fulmine still supports for
  # wallets upgraded from v0.3 and earlier.
  #
  # Its datadir is seeded by fulmine-seeder:e2e BEFORE this service starts — the
  # identity is read once, at boot, by newService(). Starting it against an
  # unseeded volume silently produces an ordinary HD wallet.
  fulmine-user-legacy:
    image: fulmine:e2e
    container_name: fulmine-user-legacy
    restart: unless-stopped
    environment:
      - FULMINE_ARK_SERVER=http://arkd:7070
      - FULMINE_ESPLORA_URL=http://mempool_web/api
      - FULMINE_BOLTZ_URL=http://boltz:9001
      - FULMINE_BOLTZ_WS_URL=ws://boltz:9004
      - FULMINE_NO_MACAROONS=true
      - FULMINE_DISABLE_TELEMETRY=true
      - FULMINE_SWAP_TIMEOUT=120
      - FULMINE_SCHEDULER_POLL_INTERVAL=10
      - FULMINE_UNLOCKER_TYPE=env
      - FULMINE_UNLOCKER_PASSWORD=password
      - FULMINE_DELEGATE_ENABLED=true
      - FULMINE_EMULATOR_PUBKEY=02999413c46fa10ada5cbc4bcc79a1d09160c2ba3cfc812705d7a13e5e545fb2a9
    volumes:
      - fulmine-user-legacy-data:/app/data
    ports:
      - "127.0.0.1:7030:7000" # gRPC  (clientTargets "singlekey")
      - "127.0.0.1:7031:7001" # REST/admin
    networks:
      - default

volumes:
  fulmine-user-legacy-data:
    name: fulmine-user-legacy-data
    external: true

# Join the stack's network (compose project name=arkade-regtest -> *_default) so
# fulmine-user resolves arkd/boltz/mempool_web by service name.
networks:
  default:
    name: arkade-regtest_default
    external: true
